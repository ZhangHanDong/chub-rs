name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

  agent-spec:
    name: Agent Spec Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install agent-spec
        run: cargo install agent-spec

      - name: Parse all specs
        run: |
          failed=0
          for spec in specs/*.spec.md; do
            echo "=== Parsing $spec ==="
            if ! agent-spec parse "$spec"; then
              failed=1
            fi
          done
          exit $failed

      - name: Lint all specs (min-score 0.7)
        run: |
          failed=0
          for spec in specs/*.spec.md; do
            echo "=== Linting $spec ==="
            if ! agent-spec lint "$spec" --min-score 0.7; then
              failed=1
            fi
          done
          exit $failed
