[package]
name = "chub-rs"
version = "0.1.1"
edition = "2024"
description = "Context Hub CLI — search and retrieve LLM-optimized docs and skills"
license = "MIT"

[lib]
name = "chub_rs"
path = "src/lib.rs"

[[bin]]
name = "chub"
path = "src/main.rs"

[[bin]]
name = "chub-mcp"
path = "src/bin/chub_mcp.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
